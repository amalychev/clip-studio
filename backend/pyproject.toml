[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "clip-studio-backend"
version = "0.1.0"
description = "Clip Studio Backend API"
requires-python = ">=3.11"
dependencies = [
  # Web framework
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "python-multipart>=0.0.9",
  "aiofiles>=23.2,<25",

  # Database
  "sqlalchemy>=2.0,<3",

  # HTTP client (for AI APIs)
  "httpx>=0.27,<1",

  # AI providers
  "anthropic>=0.40,<1",
  "openai>=1.50,<2",
  "google-generativeai>=0.8,<1",
  "mistralai>=1.0,<2",

  # TTS (Silero — no Docker, runs in-process)
  "torch>=2.2",
  "silero>=0.4.1",
  "lameenc>=1.8,<2",
  "numpy>=1.26",
  "scipy>=1.13",
  "soundfile>=0.12,<1",

  # Video
  "ffmpeg-python>=0.2,<1",
  "mutagen>=1.47,<2",

  # Speech recognition (word-level subtitle timing)
  "openai-whisper>=20231117",

  # Utilities
  "pydantic>=2.0,<3",
  "pydantic-settings>=2.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
